name: Release images

# Octopilot pipeline (docs/DESIGN-octopilot-build-and-release.md). main: lint, test and integration builds into the
# private integration registry. A v* tag (Trigger Release) creates the GitHub Release and promotes those exact digests
# into the pp acceptance registry.
#
# Public repository: every job runs on GitHub-hosted runners, never self-hosted ones. Registry access is federated
# (OIDC, id-token: write), so nothing is stored as a secret. This workflow has no pull_request trigger: pull requests
# (including forks) get pr.yml, which has no credentials at all. Promotion runs only for v* tags, which only
# administrators can create, inside the pp environment.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # main builds only when something that goes into an artifact changed. Skipped (a commit touching only these):
    # VERSION (the release commit is tagged at once; the tag run builds it), docs and other Markdown, dev-only
    # configuration (deployment-configuration, k8s, Tilt, docker-compose). GitHub does not apply path filters to tag
    # pushes, so every v* tag builds and releases everything.
    paths-ignore:
      - VERSION
      - "**/*.md"
      - docs/**
      - deployment-configuration/**
      - k8s/**
      - "Tiltfile*"
      - docker-compose.yaml
      - kind-config.yaml
  workflow_dispatch:

concurrency:
  group: sesame-idam-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The reusable workflow's release job requests contents: write; a caller granting less fails at startup.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
      actions: read     # the acceptance stage downloads this run's build results
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: false
      # The op image from main passes Skaffold buildArgs (v1.2.0 does not). Pin the next op release once it is cut.
      op_version: main
      # Release notes from our own vLLM (Qwen on the Sparks), reachable from the ms02 runners; if it is down
      # the notes fall back to the commit list and the release goes ahead.
      release_notes_provider: openai
      release_notes_base_url: http://192.168.1.104:8000/v1
      release_notes_model: Qwen/Qwen3.8-27B-FP8
      runner: ubuntu-24.04
      # Where artifacts go and which identities the run federates to are repository variables (Settings, Variables),
      # kept out of this public repository. None of them is a secret.
      integration_registry: ${{ vars.INTEGRATION_REGISTRY }}
      registry_auth: gcp-wif
      gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      release_to_ghcr: false
      acceptance_environment: pp
      acceptance_registry: ${{ vars.ACCEPTANCE_REGISTRY }}
      acceptance_service_account: ${{ vars.ACCEPTANCE_SERVICE_ACCOUNT }}
      acceptance_runner: ubuntu-24.04

  guards:
    name: Guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Release dependencies are pinned (no paths outside the repository)
        shell: python3 {0}
        run: |
          import pathlib, re, sys
          root = pathlib.Path.cwd().resolve()
          bad = []
          for toml in root.glob("microservices/**/Cargo.toml"):
              if "target" in toml.parts:
                  continue
              for n, line in enumerate(toml.read_text().splitlines(), 1):
                  for rel in re.findall(r'path\s*=\s*"([^"]+)"', line):
                      dep = (toml.parent / rel).resolve()
                      if root not in dep.parents and dep != root:
                          bad.append(f"{toml.relative_to(root)}:{n}: {rel}")
          for b in bad:
              print(f"::error::{b} is outside this repository; pin a git revision")
          sys.exit(1 if bad else 0)
      - name: No span entered across a may yield (may_tracing ADR-0001)
        # A span entered on one may worker thread and exited on another (the coroutine yielded on I/O in between)
        # leaks its OpenTelemetry context on the first thread: identity-login-service grew to ~720 MB that way
        # (PriceWhisperer docs/incidents/2026-10-23_otel_context_leak_PLAN.md). `// no-yield:` marks an allowed site.
        run: |
          curl -fsSL https://raw.githubusercontent.com/microscaler/may_tracing/v0.1.1/scripts/check-span-discipline.sh -o /tmp/span-discipline.sh
          sh /tmp/span-discipline.sh --fix-hint microservices
      - name: Every unauthenticated operation says why (x-public-reason)
        run: python3 scripts/lint-public-endpoints.py
      - name: Migration lists name files that exist
        run: |
          rc=0
          while IFS= read -r f; do
            [[ -z "$f" || "$f" =~ ^# ]] && continue
            [ -f "migrations/$f" ] || { echo "::error::migrations/apply_order.txt lists migrations/$f, which does not exist"; rc=1; }
          done < migrations/apply_order.txt
          while IFS= read -r f; do
            [[ -z "$f" || "$f" =~ ^# ]] && continue
            [ -f "microservices/idam/$f" ] || { echo "::error::seed_environments.txt lists $f, which does not exist"; rc=1; }
          done < microservices/idam/seed_environments.txt
          # seed_order.txt (generated by the migrator) names every seed file exactly once, and nothing else.
          listed=$(grep -v -e '^#' -e '^[[:space:]]*$' microservices/idam/seed_order.txt | sort)
          present=$(cd microservices/idam && ls */impl/seeds/*.sql | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::microservices/idam/seed_order.txt is stale: regenerate with cargo run -p sesame_idam_migrator"
            diff <(echo "$listed") <(echo "$present") || true
            rc=1
          fi
          exit $rc

  # Tests marked #[ignore = "pending: ..."] describe work not done yet. They run here so they stay visible, but never
  # block a release or turn the run red: the test step may fail, the job stays green and reports the failures as a
  # warning and in the job summary. A pending test that starts passing should lose its #[ignore].
  pending:
    name: Pending tests (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Ignored tests
        id: ignored
        continue-on-error: true
        working-directory: microservices
        # Live tests (live_*) need the running dev stack: just test-live, never CI.
        run: cargo nextest run --workspace --all-targets --run-ignored only --no-fail-fast -E 'not test(/::live_/)'
      - name: Report pending tests
        if: always()
        env:
          OUTCOME: ${{ steps.ignored.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "All pending tests pass: remove their #[ignore] so they gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Pending tests (advisory)::Some pending tests fail (expected for work not done yet); see the Ignored tests step."
            echo "Pending tests: some fail, as expected for work not yet done. Advisory only; see the Ignored tests step." >> "$GITHUB_STEP_SUMMARY"
          fi
