[workspace]
members = [
    # Database layer (shared across all services)
    "database",
    # Shared JWT claims crate (consolidated with all libs)
    "idam/common",
    # Migration tooling
    "migrator",
    # Local SAML/OAuth pact broker + contract publisher (Tilt dev-tools)
    "pact-mock-server",
    # IDAM microservices — gen crates (generated types + handlers)
    "idam/identity-login-service/gen",
    "idam/identity-login-service/impl",
    "idam/identity-session-service/gen",
    "idam/identity-session-service/impl",
    "idam/identity-user-mgmt-service/gen",
    "idam/identity-user-mgmt-service/impl",
    "idam/api-keys/gen",
    "idam/api-keys/impl",
    # Core services
    "idam/authz-core/gen",
    "idam/authz-core/impl",
    "idam/org-mgmt/gen",
    "idam/org-mgmt/impl",
    # Domain verification lookups (Epic 17, story 17.2)
    "idam/dns-probe/gen",
    "idam/dns-probe/impl",
]
resolver = "2"
# saml-verifier is a workspace of its own: its C dependencies (libxmlsec1, libxml2) stay out of this workspace
# and the Rust buildpack (ADR-014 §4).
exclude = ["saml-verifier"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Microscaler crates are pinned git revisions, so a clean checkout (CI, Octopilot) builds without sibling checkouts.
# Local co-development: the ancestor cargo config (~/Workspace/microscaler/.cargo/config.toml) patches these git
# URLs to the sibling paths, as for PriceWhisperer and hauliage.
sesame_common = { package = "sesame-common", path = "idam/common" }
# All shared libs are now modules within common, so individual workspace deps are removed
# BRRTRouter: default-features = false so cross builds don't pull in jemalloc
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "62f502af76961a9e3e179f23efe99eb444199b04", default-features = false }
brrtrouter_macros = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "62f502af76961a9e3e179f23efe99eb444199b04" }

# Standard dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.14"
http = "1.0"
may = "0.3"
# Microscaler fork — server plus native coroutine HTTP client.
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork", features = ["client"] }
http_legacy = { package = "http", version = "0.2" }
anyhow = "1.0"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
# 0.7 with "profiling": one jemalloc-sys across the graph with microscaler-observability's heap profiler
# (jemalloc_pprof), and heap profiles to Cloud Profiler in pp (_RJEM_MALLOC_CONF, BRRTRouter ADR 005).
tikv-jemallocator = { version = "0.7", features = ["profiling"] }
jsonwebtoken = "9.3"
ring = "0.17"
argon2 = "0.5"
base64 = { version = "0.22", features = ["alloc"] }
redis = { version = "0.25", features = ["aio", "tokio-comp", "connection-manager"] }
blake3 = "1.5"
sha2 = "0.10"
prometheus = "0.13"
thiserror = "1.0"
regex = "1.10"
futures = "0.3"
dashmap = "5.5"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
metrics = "0.22"
hex = "0.4"
hmac = "0.12"
once_cell = "1.19"
lazy_static = "1.4"
tracing = "0.1"

# DPoP (RFC 9449) — Ed25519 and P-256 key support
ed25519-dalek = { version = "2", features = ["rand_core"] }
ed25519-zebra = "4"
p256 = { version = "0.13", features = ["ecdsa"] }

# Database
lifeguard = { git = "https://github.com/microscaler/lifeguard.git", rev = "75e0e5fa57e585b4345f7b0e9da49e381c5bf44f" }
lifeguard-derive = { git = "https://github.com/microscaler/lifeguard.git", rev = "75e0e5fa57e585b4345f7b0e9da49e381c5bf44f" }
lifeguard-migrate = { git = "https://github.com/microscaler/lifeguard.git", rev = "75e0e5fa57e585b4345f7b0e9da49e381c5bf44f" }
# The revision lifeguard pins: lifeguard-derive generates code against this crate, so the services must share it.
may_postgres = { git = "https://github.com/microscaler/may_postgres.git", rev = "4cff8ff730fa948b680d3c1f34d158120b205df7" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Decimal types from OpenAPI format: decimal / money
rust_decimal = { version = "1.33", features = ["serde-float", "db-postgres"] }
sea-query = { version = "1.0.2", features = ["with-json", "with-chrono", "with-uuid", "with-rust_decimal"] }


# Patch crates.io may_minihttp → merged microscaler integration branch.
[patch.crates-io]
# sea-query 1.0.2 emits a bounded window-frame offset with no separator
# ("$1PRECEDING") that Postgres rejects; the fix + regression tests live on
# the microscaler fork (still version 1.0.2; PR to SeaQL pending). Aligns
# this workspace with lifeguard + PriceWhisperer.
sea-query = { git = "https://github.com/microscaler/sea-query.git", branch = "master" }
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork" }
