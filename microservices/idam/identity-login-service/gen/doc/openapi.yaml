        '404':
          description: No SMS configuration for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-brrtrouter-impl: true
    put:
      tags:
      - TenantAdmin
      summary: Configure this tenant's SMS sender
      description: |
        Tenant self-service (ADR-011); the tenant comes from the token.

        Prefer `connect` custody: Twilio bills the tenant directly and Sesame
        holds no credential. `envelope` custody stores the tenant's auth token
        encrypted and is restricted to approved tenants.

        The configuration lands as `pending_validation` and does not send until
        a live check promotes it, so a typo fails closed to email rather than
        burning sends.
      operationId: tenant_sms_upsert
      security:
      - BearerAuth: []
      parameters:
      - name: environment
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,31}$'
      requestBody:
        required: true
        content:
          application/json:
