components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique resource identifier (UUID)
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (from Identity Service)
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
    PlatformServiceAuth:
      type: apiKey
      in: header
      name: X-Platform-Admin-Key
      description: Platform operator / provisioning worker service key (not end-user JWT)
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - unauthorized_client
          - unsupported_grant_type
          - unsupported_response_type
          - invalid_scope
          - access_denied
          - temporarily_unavailable
          - server_error
          - invalid_credentials
          - invalid_grant
          - invalid_code
          - account_locked
          - mfa_required
          - email_not_confirmed
          - phone_not_verified
          - duplicate_email
          - weak_password
          - rate_limited
          - invalid_token
          - not_found
          - unsupported_provider
          - invalid_client_metadata
          - validation_error
          - internal_error
          - unauthorized
          - email_in_use
          - forbidden
          - slug_taken
          - invalid_slug
          - reserved_slug
          - invalid_provisioning_mode
          - tenant_unknown
          - tenant_not_active
          - tenant_not_found
          - tenant_deprovisioned
          - invalid_status_transition
          - oauth_config_not_found
          - envelope_custody_forbidden
          - platform_auth_unconfigured
          - not_a_support_agent
          - not_in_target_org
          - cross_tenant_impersonation_not_allowed
          - impersonation_chain_not_allowed
          - max_concurrent_impersonations_reached
          - login_required
          - passkey_required
          - factor_exists
          - policy_requires_factor
          - mfa_unavailable
          description: |
            Machine-readable error code. Every code a handler can answer is listed: responses are validated against
            this schema, so an unlisted code turns into a 500 (tests/openapi_security.rs keeps the list complete).
        error_description:
          type: string
          description: Human-readable error message
        retry_after:
          type: integer
          description: Retry-After seconds (only for rate_limited)
        hint:
          type: string
          description: Additional guidance for resolving the error
      example:
        error: invalid_request
        error_description: Unauthorized (invalid or missing token)
    LoginRequest:
      type: object
      required:
      - client_id
      - email
      - password
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Registered relying-party client used to derive tenant and application context
        email:
          type: string
          format: email
          description: Primary email address
        password:
          type: string
          minLength: 8
          description: User's password
        organization_id:
          type: [string, 'null']
          format: uuid
          description: Optional org hint for multi-tenant login
      example: *id038
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - user_id
      properties:
        access_token:
          type: string
          description: JWT access token (valid for 15 minutes by default)
        token_type:
          type: string
          enum:
          - Bearer
          description: Always "Bearer"
        expires_in:
          type: integer
          description: 'Access token lifetime in seconds (default: 900)'
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
        refresh_token_expires_in:
          type: integer
          description: 'Refresh token lifetime in seconds (default: 2592000 = 30 days)'
        user_id:
          type: string
          format: uuid
          description: UUID of the authenticated user
        mfa_required:
          type: boolean
          description: Whether MFA is required for this user
        id_token:
          type: [string, 'null']
          description: OpenID Connect ID token (present in OIDC flows)
        scope:
          type: [string, 'null']
          description: Granted OAuth scopes
        entitlements_ref:
          type: string
          description: 'Deterministic reference to the user''s entitlements snapshot (format: ent_<uuid_v5>)'
          example: ent_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        entitlements_hash:
          type: string
          description: 'SHA-256 hash of the canonical JSON representation of the entitlements snapshot (format: sha256:<hex>)'
          example: sha256:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
        roles:
          type: array
          items:
            type: string
          description: User's roles within the organization
          example:
          - admin
          - billing-viewer
        permissions:
          type: array
          items:
            type: string
          description: Bounded set of permissions from the entitlements snapshot
          example:
          - org:admin
          - billing:read
        token_version:
          type: integer
          format: int64
          description: Monotonically increasing token version (for revocation). Each token issue increments this value. Used by consumers to detect stale permissions.
          example: 42
      example: *id039
    PendingEmailVerificationResponse:
      type: object
      required:
      - user_id
      - email
      - email_verified
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the newly created user
        email:
          type: string
          format: email
          description: Email address (unverified)
        email_verified:
          type: boolean
          description: "Always false \u2014 user must confirm via email link"
        message:
          type: string
          example: A confirmation email has been sent. Please verify your email to complete registration.
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required:
      - mfa_required
      - mfa_token
      - expires_in
      - methods
      properties:
        mfa_required:
          type: boolean
          description: Always true
        mfa_token:
          type: string
          description: Opaque, single-sign-in value for the next step (/auth/mfa/verify, /auth/passkeys/*, enrolment)
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the sign-in step expires
        methods:
          type: array
          description: Second factors that may be used now (empty when enrolment is required)
          items:
            type: string
            enum:
            - totp
            - passkey
            - recovery_code
        enrollment_required:
          type: [string, 'null']
          description: 'Policy requires enrolling a method before signing in: `mfa` (authenticator app or passkey) or
            `passkey`'
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      - method
      - code
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
        method:
          type: string
          enum:
          - totp
          - recovery_code
        code:
          type: string
          minLength: 6
          maxLength: 32
    MfaTokenRequest:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
    MfaFactorRef:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      - factor_id
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
        factor_id:
          type: string
          format: uuid
    MfaFactorRenameRequest:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      - factor_id
      - label
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
        factor_id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 64
    MfaManageResponse:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      - expires_in
      properties:
        mfa_token:
          type: string
        expires_in:
          type: integer
          minimum: 0
    MfaFactor:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - label
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - totp
          - passkey
        label:
          type: string
        created_at:
          type: integer
          description: Unix seconds
        last_used_at:
          type: [integer, 'null']
          description: Unix seconds of the last successful use
        synced:
          type: [boolean, 'null']
          description: For a passkey, whether it can be synced between devices (backup-eligible)
    MfaFactorsResponse:
      type: object
      additionalProperties: false
      required:
      - factors
      - recovery_codes_left
      - required
      - totp_available
      - passkeys_available
      properties:
        factors:
          type: array
          items:
            $ref: '#/components/schemas/MfaFactor'
        recovery_codes_left:
          type: integer
          minimum: 0
        required:
          type: string
          enum:
          - none
          - mfa
          - passkey
          description: What the account's organisation policy requires
        totp_available:
          type: boolean
        passkeys_available:
          type: boolean
    MfaRecoveryCodesResponse:
      type: object
      additionalProperties: false
      required:
      - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    MfaTotpEnrollRequest:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
        label:
          type: [string, 'null']
          maxLength: 64
    MfaTotpEnrollResponse:
      type: object
      additionalProperties: false
      required:
      - factor_id
      - secret
      - otpauth_uri
      - digits
      - period
      properties:
        factor_id:
          type: string
          format: uuid
        secret:
          type: string
          description: Base32 secret, for typing into an authenticator app
        otpauth_uri:
          type: string
          description: Key URI for a QR code
        digits:
          type: integer
        period:
          type: integer
    MfaTotpConfirmRequest:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      - factor_id
      - code
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
        factor_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 6
          maxLength: 8
    MfaEnrolledResponse:
      type: object
      additionalProperties: false
      required:
      - factor
      properties:
        factor:
          $ref: '#/components/schemas/MfaFactor'
        recovery_codes:
          type: array
          description: The account's first recovery codes, shown once (present only when this was its first factor)
          items:
            type: string
        tokens:
          $ref: '#/components/schemas/TokenResponse'
    PasskeyChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: [string, 'null']
          maxLength: 128
          description: Registered client (username-less sign-in binds the tenant through it)
        mfa_token:
          type: [string, 'null']
          maxLength: 64
          description: The sign-in this passkey is the second factor of
    PasskeyOptionsResponse:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - options
      properties:
        challenge_id:
          type: string
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options as JSON (`publicKey`, binary members base64url-encoded; `mediation` when conditional)
    PasskeyVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - credential
      properties:
        challenge_id:
          type: string
          minLength: 40
          maxLength: 64
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from navigator.credentials.get(), JSON-encoded (base64url binary members)
        client_id:
          type: [string, 'null']
          maxLength: 128
        mfa_token:
          type: [string, 'null']
          maxLength: 64
        organization_id:
          type: [string, 'null']
          format: uuid
    PasskeyRegisterRequest:
      type: object
      additionalProperties: false
      required:
      - mfa_token
      - challenge_id
      - credential
      properties:
        mfa_token:
          type: string
          minLength: 40
          maxLength: 64
        challenge_id:
          type: string
          minLength: 40
          maxLength: 64
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from navigator.credentials.create(), JSON-encoded (base64url binary members)
        label:
          type: [string, 'null']
          maxLength: 64
    EmailOTPRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          description: Email address to send OTP to
      example: *id041
    EmailOTPVerifyRequest:
      type: object
      required:
      - email
      - code
      properties:
        email:
          type: string
          format: email
          description: Email address that received the OTP
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit OTP code sent to email
      example: *id042
    PhoneOTPRequest:
      type: object
      required:
      - phone
      properties:
        phone:
          type: string
          pattern: ^\\+[1-9]\\d{1,14}$
          description: Phone number in E.164 format (e.g. +14155551234)
      example: *id043
    PhoneOTPVerifyRequest:
      type: object
      required:
      - phone
      - code
      properties:
        phone:
          type: string
          pattern: ^\\+[1-9]\\d{1,14}$
          description: Phone number that received the OTP (E.164 format)
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit SMS OTP code
      example: *id044
    DualOTPRequest:
      type: object
      required:
      - email
      - phone
      properties:
        email:
          type: string
          format: email
          description: Email address to send OTP to
        phone:
          type: string
          pattern: ^\\+[1-9]\\d{1,14}$
          description: Phone number in E.164 format (e.g. +14155551234)
        send_welcome_email:
          type: boolean
          default: false
          description: Send welcome email after successful verification
      example: *id045
    DualOTPResponse:
      type: object
      required:
      - success
      - email_sent
      - phone_sent
      properties:
        success:
          type: boolean
          example: true
        email_sent:
          type: boolean
          description: Whether OTP was sent to email
        phone_sent:
          type: boolean
          description: Whether OTP was sent to phone
        email_verified:
          type: boolean
          example: false
          description: Whether email was previously verified
        phone_verified:
          type: boolean
          example: false
          description: Whether phone was previously verified
        both_verified:
          type: boolean
          example: false
          description: Whether both were already verified (auto-complete login)
        message:
          type: string
          example: Verification codes have been sent to your email and phone
      example: *id046
    DualOTPVerifyRequest:
      type: object
      required:
      - email
      - phone
      properties:
        email:
          type: string
          format: email
          description: Email address to verify
        email_code:
          type: [string, 'null']
          minLength: 6
          maxLength: 6
          description: 6-digit email OTP code (omit if already verified)
        phone:
          type: string
          pattern: ^\\+[1-9]\\d{1,14}$
          description: Phone number to verify (E.164 format)
        phone_code:
          type: [string, 'null']
          minLength: 6
          maxLength: 6
          description: 6-digit phone OTP code (omit if already verified)
        session_id:
          type: string
          format: uuid
          description: Session ID from the dual-otp send step
      example: *id047
    DualOTPCompleteResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - user_id
      allOf:
      - $ref: '#/components/schemas/TokenResponse'
      properties:
        newly_verified_email:
          type: boolean
          description: Whether email was just verified in this operation
        newly_verified_phone:
          type: boolean
          description: Whether phone was just verified in this operation
      example: *id048
    DualOTPPartialResponse:
      type: object
      required:
      - success
      - email_verified
      - phone_verified
      - both_verified
      properties:
        success:
          type: boolean
          example: true
        email_verified:
          type: boolean
          description: Current email verification status
        phone_verified:
          type: boolean
          description: Current phone verification status
        both_verified:
          type: boolean
          description: "Always false \u2014 both codes still needed"
        message:
          type: string
          example: Email verified. Please verify your phone to complete login.
      example: *id049
    RegisterRequest:
      type: object
      required:
      - client_id
      - email
      - password
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Registered relying-party client used to derive tenant and application context
        email:
          type: string
          format: email
          description: Primary email address (must be unique)
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: User's password (minimum 8 characters)
        first_name:
          type: [string, 'null']
          maxLength: 100
          description: User's first name
        last_name:
          type: [string, 'null']
          maxLength: 100
          description: User's last name
        username:
          type: [string, 'null']
          minLength: 3
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]+$
          description: Optional human-identifiable username
        phone:
          type: [string, 'null']
          pattern: ^\\+[1-9]\\d{1,14}$
          description: Phone number in E.164 format (for dual verification flow)
      example: *id050
    TokenRequest:
      type: object
      required:
      - grant_type
      properties:
        grant_type:
          type: string
          enum:
          - refresh_token
          - client_credentials
          - authorization_code
          - urn:ietf:params:oauth:grant-type:token-exchange
          description: OAuth2 grant type
        code:
          type: string
          description: |
            One-time authorization code from the hosted auth surface
            (required for authorization_code grant). Single-use, short TTL,
            bound to the tenant and redirect_uri it was minted for.
        redirect_uri:
          type: string
          description: |
            Redirect URI the code was minted for (authorization_code grant).
            Must match exactly — this binding is what stops a stolen code
            being redeemed by a different app.
        refresh_token:
          type: string
          description: Refresh token (required for refresh_token grant)
        scope:
          type: string
          description: Requested scopes (space-separated)
        client_id:
          type: string
          description: Client ID (required for client_credentials and token exchange)
        client_secret:
          type: string
          description: Client secret (required for client_credentials and token exchange)
        subject_token:
          type: string
          description: Subject token for token exchange (RFC 8693)
        subject_token_type:
          type: string
          enum:
          - urn:ietf:params:oauth:token-type:access_token
          - urn:ietf:params:oauth:token-type:refresh_token
          description: Type of the subject token
        requested_token_type:
          type: string
          enum:
          - urn:ietf:params:oauth:token-type:access_token
          - urn:ietf:params:oauth:token-type:refresh_token
          description: Type of token being requested
        actor_token:
          type: string
          description: Optional actor token for nested delegation (RFC 8693)
      example: *id051
    TokenExchangeResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - issued_token_type
      properties:
        access_token:
          type: string
          description: New access token with act claim for delegated access
        refresh_token:
          type: string
          description: New rotating refresh token
        token_type:
          type: string
          enum:
          - Bearer
          description: Always "Bearer"
        expires_in:
          type: integer
          description: 'Access token lifetime in seconds (default: 900)'
        scope:
          type: string
          description: Granted scopes (space-delimited)
        issued_token_type:
          type: string
          enum:
          - urn:ietf:params:oauth:token-type:access_token
          description: Type of issued token
        iss:
          type: string
          description: 'Issuer of the token (RFC 8693 F-003). Default: idam issuer URL.'
        aud:
          type: array
          items:
            type: string
          description: "Audience(s) for the token \u2014 merged from subject and actor audiences (RFC 8693 F-012)"
        iat:
          type: integer
          format: int64
          description: Issued-at Unix timestamp (RFC 8693 F-003)
      example:
        access_token: eyJhbG...ifX0.sig
        refresh_token: bmV3LXJlZnJlc2gtdG9rZW4tZXhjaGFuZ2U
        token_type: Bearer
        expires_in: 900
        scope: profile:read orders:write
        issued_token_type: urn:ietf:params:oauth:token-type:access_token
        iss: https://idam.example.com
        aud:
        - myapp.com
        - support-portal.com
        iat: 1715000000
    ForgotPasswordRequest:
      type: object
