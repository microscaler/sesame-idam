  /oauth/authorize:
    get:
      tags:
      - Sessions
      summary: OAuth2 authorization endpoint
      description: 'Validates a registered client and redirects the browser to the hosted Sesame authorization surface.

        After successful login, redirects to `redirect_uri` with `code` parameter.

        Supports PKCE for public clients.
        Tenant and application context are derived from `client_id`; this endpoint
        does not trust a tenant-selection header.'
      operationId: oauth_authorize
      x-public-reason: "pre-authentication: start of the redirect flow"
      security: []
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: OAuth2 client ID
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - code
        description: Must be `code` for authorization code flow
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: Registered redirect URI
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: CSRF protection state parameter
      - name: scope
        in: query
        required: true
        schema:
          type: string
        description: Requested scopes (openid, email, profile, etc.)
      - name: nonce
        in: query
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 512
        description: OIDC nonce bound into the ID token
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 128
        description: PKCE code challenge (S256)
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
          enum:
          - S256
        description: PKCE method; only S256 is supported
      responses:
        '400':
          description: "Bad request \u2014 validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: validation_error
                message: Request validation failed
        '302':
          description: Redirect to login page or back with authorization code
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      x-consumer: frontend
      x-consumer-note: OAuth authorization endpoint called by frontend browser
      x-brrtrouter-impl: true
  /oauth/authorize/complete:
    post:
      tags:
      - Sessions
      summary: Complete a hosted authorization session after user authentication
      operationId: oauth_authorize_complete
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcAuthorizationCompleteRequest'
      responses:
        # 200 with the redirect, not a 302: the hosted surface calls this with fetch() (it needs the Authorization
        # header), and a browser never exposes a redirect's Location to fetch() (redirect: manual gives an opaque
        # response). The page navigates to `redirect` itself.
        '200':
          description: The relying party's redirect URI with code and state; the hosted surface navigates to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcAuthorizationCompleteResponse'
        '400':
