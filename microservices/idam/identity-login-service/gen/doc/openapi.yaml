openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: Login Service
  version: 1.0.0
  description: "Slow-path service for authentication flows.\nHandles password login, registration, token exchange, password\
    \ reset,\nsocial login redirects, and OAuth2 authorization.\nHIGH frequency with HIGH per-request cost (bcrypt/scrypt\
    \ hashing, token signing).\nCPU-bound operations limit throughput \u2014 requires vertical scaling.\n"
  contact:
    name: Platform / Security
servers:
- url: http://identity-login-service:8080/idam/v1
  description: In-cluster (sesame-idam namespace, ClusterIP :8080)
- url: /idam/v1
  description: Relative path behind gateway
tags:
- name: AuthFlows
  description: Authentication flows (login, register, token exchange, OTP, social)
- name: PasswordReset
  description: Forgot/reset password flows
- name: SocialLogin
  description: OAuth provider login redirects (GitHub, Google, SAML)
- name: Sessions
  description: Token management and session lifecycle
- name: Signup
  description: Pre-registration validation
- name: Passwordless
  description: Passwordless magic link authentication
- name: PlatformAdmin
  description: Platform tenant provisioning and OAuth metadata (ops / service account only)
- name: UserManagement
  description: User profile management and PII retrieval endpoints
security:
- BearerAuth: []
- ApiKeyHeader: []
paths:
  /auth/login:
    post:
      tags:
      - AuthFlows
      summary: Login with password
      description: 'Authenticate with email+password. Returns access token and refresh token.

        If the account has a second factor, or its organisation requires one, returns 202 with an `mfa_token` and the next
        step (ADR-008); no token is issued until it completes.

        Tenant is bound via registered `client_id`. Optional legacy `X-Tenant-ID`
        must match the client tenant when present; public edges may strip it.'
      operationId: auth_login
      x-public-reason: "pre-authentication: this is how a token is obtained"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default: &id001
                summary: Example for auth_login
                value: &id038
                  client_id: hauliage-web
                  email: alice@example.com
                  password: SecureP@ss123!
                  organization_id: 1189c444-8a2d-4c41-8b4b-ae43ce79a492
            example: *id001
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default: &id002
                  summary: Example for auth_login 200
                  value: &id039
                    access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjMiLCJlbWFpbCI6ImFsaWNlQGV4cC5jb20iLCJvcmdfaWQiOiIxMTg5YzQ0NCJ9.sig
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: cmVmcmVzaC10b2tlbi1hbGljZS1zZXNzaW9u
                    refresh_token_expires_in: 2592000
                    user_id: 31c41c16-c281-44ae-9602-8a047e3bf33d
                    mfa_required: false
                    id_token: null
                    scope: openid profile email
              example: *id002
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '202':
          description: 'A second step is needed (ADR-008): the account has a second factor, or its organisation policy
            requires enrolling one. No token is issued; continue with the returned mfa_token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '503':
          description: Sign-in temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content: &id006
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal_error
                error_description: An unexpected error occurred
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        schema:
          type: string
        description: Legacy tenant hint. Public callers use client_id; when present this value must match the registered client tenant.
      x-consumer: frontend
      x-consumer-note: Direct browser call for user login
      x-brrtrouter-impl: true
  /auth/login/dual-otp:
    post:
      tags:
      - AuthFlows
      summary: Send OTPs to both email and phone simultaneously
      description: 'Step 1 of dual OTP verification. Sends OTP codes to both the user''s

        email and phone number. User must verify both codes before login completes.

        Used when a user is signing up or logging in with both email and phone provided.



        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: login_dual_otp
      x-public-reason: "pre-authentication: initiates a login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DualOTPRequest'
            examples:
              default: &id004
                summary: Example for login_dual_otp
                value: &id045
                  email: alice@example.com
                  phone: '+1234567890'
            example: *id004
      responses:
        '200':
          description: OTPs sent to both channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualOTPResponse'
              examples:
                default: &id005
                  summary: Example for login_dual_otp 200
                  value: &id046
                    success: true
                    email_sent: true
                    phone_sent: true
                    both_verified: false
                    message: Verification codes have been sent to your email and phone
              example: *id005
        '400':
          description: Bad request (missing email or phone, user not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: &id009
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: unauthorized
                error_description: Authentication required
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - &id007
        name: X-Tenant-ID
        in: header
        required: false
        schema:
          type: string
        description: >
          Legacy tenant hint. Pre-auth callers should bind tenant via registered
          `client_id` (query/body). When present this value must match the client
          tenant; public edges may strip it.
      x-consumer: frontend
      x-consumer-note: Direct browser call to send OTP to email+phone
      x-brrtrouter-impl: true
  /auth/login/email-otp:
    post:
      tags:
      - AuthFlows
      summary: Send email OTP
      description: 'Sends a time-limited OTP code to the user''s email address.

        Used for passwordless email login and dual OTP verification.



        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: login_email_otp
      x-public-reason: "pre-authentication: initiates a login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOTPRequest'
            examples:
              default: &id008
                summary: Example for login_email_otp
                value: &id041
                  email: alice@example.com
            example: *id008
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Verification code sent to your email
        '400':
          description: Bad request (invalid email, account not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to send OTP
      x-brrtrouter-impl: true
  /auth/login/magic-link:
    post:
      tags:
      - Passwordless
      summary: Send magic link for passwordless login
      description: 'Sends a time-limited magic link to the user email. The user clicks the link to complete login without
        a password.


        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: magic_link_send
      x-public-reason: "pre-authentication: initiates a login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
            examples:
              default: &id010
                summary: Example for magic_link_send
                value: &id056
                  email: alice@example.com
            example: *id010
      responses:
        '200':
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkResponse'
              examples:
                default: &id011
                  summary: Example for magic_link_send 200
                  value: &id057
                    magic_link_sent: true
                    expires_in: 900
                    message: A magic link has been sent to your email
              example: *id011
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to send magic link to email
      x-brrtrouter-impl: true
  /auth/login/magic-link/verify:
    post:
      tags:
      - Passwordless
      summary: Verify magic link token and complete login
      description: 'Verifies the magic link token. On success, returns access token and refresh token.


        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: magic_link_verify
      x-public-reason: "the emailed link token in the request IS the credential"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
            examples:
              default: &id012
                summary: Example for magic_link_verify
                value: &id058
                  token: magic-link-token-abc
            example: *id012
      responses:
        '200':
          description: Magic link verified, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default: &id013
                  summary: Example for magic_link_verify 200
                  value:
                    access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjMiLCJlbWFpbCI6ImFsaWNlQGV4cC5jb20ifQ.sig
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: cmVmcmVzaC10b2tlbi1tYWdpYy1saW5r
                    refresh_token_expires_in: 2592000
                    user_id: 31c41c16-c281-44ae-9602-8a047e3bf33d
                    mfa_required: false
                    id_token: null
                    scope: openid
              example: *id013
        '202':
          description: A second factor (or its enrolment) is needed before tokens are issued (ADR-008)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to verify magic link token
      x-brrtrouter-impl: true
  /auth/login/phone-magic-link:
    post:
      tags:
      - Passwordless
      summary: Send SMS magic link for passwordless login
      description: 'Sends a time-limited magic link via SMS to the user phone.


        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: sms_magic_link_send
      x-public-reason: "pre-authentication: initiates a login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsMagicLinkRequest'
            examples:
              default: &id014
                summary: Example for sms_magic_link_send
                value: &id059
                  phone: '+1234567890'
            example: *id014
      responses:
        '200':
          description: SMS magic link sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsMagicLinkResponse'
              examples:
                default: &id015
                  summary: Example for sms_magic_link_send 200
                  value: &id060
                    magic_link_sent: true
                    expires_in: 900
                    message: A magic link has been sent to your phone
              example: *id015
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to send magic link to phone
      x-brrtrouter-impl: true
  /auth/login/phone-magic-link/verify:
    post:
      tags:
      - Passwordless
      summary: Verify SMS magic link token and complete login
      description: 'Verifies the SMS magic link token. On success, returns access token and refresh token.


        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: sms_magic_link_verify
      x-public-reason: "the SMS link token in the request IS the credential"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsMagicLinkVerifyRequest'
            examples:
              default: &id016
                summary: Example for sms_magic_link_verify
                value: &id061
                  token: sms-magic-token-xyz
            example: *id016
      responses:
        '200':
          description: SMS magic link verified, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default: &id017
                  summary: Example for sms_magic_link_verify 200
                  value:
                    access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjMiLCJlbWFpbCI6ImFsaWNlQGV4cC5jb20ifQ.sig
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: cmVmcmVzaC10b2tlbi1zbXMtbWFn
                    refresh_token_expires_in: 2592000
                    user_id: 31c41c16-c281-44ae-9602-8a047e3bf33d
                    mfa_required: false
                    id_token: null
                    scope: openid
              example: *id017
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to verify SMS magic link token
      x-brrtrouter-impl: true
  /auth/login/phone-otp:
    post:
      tags:
      - AuthFlows
      summary: Send phone SMS OTP
      description: 'Sends a 6-digit SMS OTP code to the user''s phone number.

        Used for passwordless phone login and dual OTP verification.



        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: login_phone_otp
      x-public-reason: "pre-authentication: initiates a login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneOTPRequest'
            examples:
              default: &id018
                summary: Example for login_phone_otp
                value: &id043
                  phone: '+1234567890'
            example: *id018
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Verification code sent to your phone
        '400':
          description: Bad request (invalid phone, SMS provider error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to send OTP to phone
      x-brrtrouter-impl: true
  /auth/logout:
    post:
      tags:
      - Sessions
      summary: Logout (revoke refresh token)
      description: 'Revokes the current refresh token and ends the user''s session.

        Requires BearerAuth header with a valid access token.



        Requires `X-Tenant-ID` header for tenant resolution.'
      operationId: auth_logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              default: &id019
                summary: Example for auth_logout
                value: &id054
                  refresh_token: cmVmcmVzaC10b2tlbi1hbGljZS1zZXNzaW9u
            example: *id019
      responses:
        '400':
          description: "Bad request \u2014 validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: validation_error
                message: Request validation failed
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized (invalid or missing token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to logout current session
      x-brrtrouter-impl: true
  /auth/password/forgot:
    post:
      tags:
      - PasswordReset
      summary: Request password reset email
      description: 'Sends a password reset email with a time-limited token to the given email.

        Tenant is bound via registered `client_id`. Optional legacy `X-Tenant-ID`
        must match the client tenant when present; public edges may strip it.'
      operationId: auth_forgot_password
      x-public-reason: "pre-authentication: the user cannot sign in, that is the point"
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            examples:
              default: &id020
                summary: Example for auth_forgot_password
                value: &id052
                  client_id: hauliage-web
                  email: alice@example.com
            example: *id020
      responses:
        '200':
          description: Reset email sent (returns success regardless of email existence)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Whether the request was accepted
                  message:
                    type: string
                    example: If the email is registered, a reset link has been sent
                    description: Human-readable message for the user
                  expires_in:
                    type: integer
                    description: Token expiry time in minutes (e.g., 15)
                    example: 15
                  token_type:
                    type: string
                    example: reset
                    description: Type of token issued (helps clients handle display)
                required:
                - success
                - message
                description: Password reset request response with token expiry information
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to request password reset
      x-brrtrouter-impl: true
  /auth/password/reset:
    post:
      tags:
      - PasswordReset
      summary: Confirm password reset with token
      description: 'Validates the reset token from the password reset email and sets a new password.

        Tenant is bound via registered `client_id`. Optional legacy `X-Tenant-ID`
        must match the client tenant when present; public edges may strip it.'
      operationId: auth_reset_password
      x-public-reason: "the emailed reset token in the request IS the credential"
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              default: &id021
                summary: Example for auth_reset_password
                value: &id053
                  client_id: hauliage-web
                  token: reset-token-abc123
                  new_password: NewSecureP@ss456!
            example: *id021
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password has been reset successfully
        '400':
          description: Invalid or expired reset token, weak new password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Direct browser call to reset password with token
      x-brrtrouter-impl: true
  /auth/register:
    post:
      tags:
      - AuthFlows
      summary: Register new user with email and password
      description: 'Creates a new user account with email+password.

        Returns access token immediately if email auto-verified, otherwise returns

        pending-verification state requiring email confirmation.



        Tenant is bound via registered `client_id` (same as login). Optional legacy

        `X-Tenant-ID` must match the client tenant when present; public edges may strip it.'
      operationId: auth_register
      x-public-reason: "pre-authentication: creates the account a token would belong to"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default: &id022
                summary: Example for auth_register
                value: &id050
                  client_id: hauliage-web
                  email: newuser@example.com
                  password: SecureP@ss123!
                  first_name: New
                  last_name: User
                  username: newuser
                  send_welcome_email: true
            example: *id022
      responses:
        '201':
          description: User created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default: &id023
                  summary: Example for auth_register 201
                  value:
                    access_token: eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjMiLCJlbWFpbCI6Im5ld3VzZXJAZXhwLmNvbSJ9.sig
                    token_type: Bearer
                    expires_in: 900
                    refresh_token: cmVmcmVzaC10b2tlbi1yZWdpc3Rlci1uZXc
                    refresh_token_expires_in: 2592000
                    user_id: 31c41c16-c281-44ae-9602-8a047e3bf33d
                    mfa_required: false
                    id_token: null
                    scope: openid
              example: *id023
        '400':
          description: Validation error (duplicate email, weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthorized \u2014 invalid, expired, or missing credentials"
          content: *id009
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        schema:
          type: string
        description: Legacy tenant hint. Public callers use client_id; when present this value must match the registered client tenant.
      x-consumer: frontend
      x-consumer-note: Direct browser call for new user registration
      x-brrtrouter-impl: true
  /sessions/active-organization:
    post:
      tags:
      - AuthFlows
      summary: Set active organization and re-issue tokens with org_id claim
      operationId: set_active_organization
      security:
      - BearerAuth: []
      parameters:
      - name: X-Tenant-ID
        in: header
        required: false
        schema:
          type: string
        description: Legacy tenant hint. The validated access-token tenant is authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - organization_id
              properties:
                organization_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: New tokens including org_id
          content:
            application/json:
