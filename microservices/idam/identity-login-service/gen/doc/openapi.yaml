          description: Invalid custody mode or missing fields for that mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant administrator role required, or envelope custody not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-brrtrouter-impl: true
    delete:
      tags:
      - TenantAdmin
      summary: Revoke this tenant's SMS sender
      description: |
