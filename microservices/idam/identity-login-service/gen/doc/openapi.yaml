    post:
      tags:
      - Sessions
      summary: Mint a one-time authorization code for cross-origin handoff
      description: |
        Called by the HOSTED AUTH SURFACE once a user has authenticated, to
        hand the resulting session to a tenant application that lives on a
        DIFFERENT origin.

        Browser storage is origin-scoped, so the tenant app cannot read the
        auth origin's tokens. This endpoint stores them server-side against a
        single-use, short-TTL code bound to (tenant, redirect_uri); the code
        travels in the redirect URL and is redeemed via
        `POST /auth/token` with `grant_type=authorization_code`.

        Tokens themselves are NEVER placed in a URL — that is the entire
        point (URLs leak via history, referrers and logs).
