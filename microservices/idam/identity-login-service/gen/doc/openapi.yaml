        auditable.
      operationId: tenant_sms_revoke
      security:
      - BearerAuth: []
      parameters:
      - name: environment
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,31}$'
      responses:
        '200':
          description: Configuration revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSmsConfigResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No SMS configuration for this environment
          content:
            application/json:
              schema:
