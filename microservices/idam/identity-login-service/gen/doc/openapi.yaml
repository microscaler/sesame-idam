        client_id:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        secret_env_key:
          type: string
        client_id_env_key:
          type: [string, 'null']
        config_version:
          type: integer
        enabled:
          type: boolean
        last_rotated_at:
          type: [string, 'null']
          format: date-time
