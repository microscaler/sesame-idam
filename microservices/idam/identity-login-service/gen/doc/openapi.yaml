      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - access_token
              - redirect_uri
              properties:
                access_token:
                  type: string
                  description: Access token just issued to the authenticated user.
                refresh_token:
                  type: string
                  description: Refresh token, if one was issued.
                redirect_uri:
                  type: string
                  description: Where the code will be delivered; binds the code.
            examples:
              default: &id_sc_req
                summary: Example for auth_session_code
                value:
                  access_token: eyJhbGciOiJFZERTQSJ9.payload.sig
                  refresh_token: eyJhbGciOiJFZERTQSJ9.refresh.sig
                  redirect_uri: https://app.tenant.com/callback
            example: *id_sc_req
      responses:
        '200':
          description: Code minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  expires_in:
                    type: integer
                    format: int32
              examples:
                default: &id_sc_res
                  summary: Example for auth_session_code 200
                  value:
                    code: 7Yk2t0Yr8Qn1pW5xQ3vB6mZ9aL4cS8dE
                    expires_in: 60
              example: *id_sc_res
        '400':
          description: Invalid token or redirect_uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content: *id006
      parameters:
      - *id007
      x-consumer: frontend
      x-consumer-note: Hosted auth surface only; converts a session into a one-time code
      x-brrtrouter-impl: true
