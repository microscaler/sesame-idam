              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authenticated user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-brrtrouter-impl: true
