      summary: Whether a pending authorization request can still be completed
      description: 'Read-only check the hosted login page makes on load and whenever its tab is shown again. It does not
        use or extend the request (which stays single-use). When the request has expired or was used, the page sends the
        browser to the client''s registered `initiate_login_uri` (returned here; never a value from the request) so the
