          type: string
          pattern: '^[a-z][a-z0-9-]{2,63}$'
        display_name:
          type: string
        provisioning_mode:
          type: string
          enum:
          - platform
          default: platform
        activate:
          type: boolean
          default: true
          description: When true, status is active immediately; otherwise provisioning
    PlatformTenantStatusPatch:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - provisioning
          - active
          - suspended
          - deprovisioned
          - failed
    PlatformTenantDetail:
      allOf:
      - $ref: '#/components/schemas/PlatformTenant'
      - type: object
        properties:
          oauth_providers:
            type: array
            items:
              $ref: '#/components/schemas/TenantOAuthConfigResponse'
    TenantSmsConfigRequest:
      type: object
      required:
      - custody_mode
      properties:
        custody_mode:
          type: string
          enum:
          - connect
          - envelope
          description: |
            `connect` (preferred): Twilio bills the tenant; Sesame stores no
            secret. `envelope`: tenant credentials sealed at rest — dogfood
            tenants only.
        connected_account_sid:
          type: [string, 'null']
          description: Required for `connect`. Not a secret; revocable by the tenant.
        account_sid:
          type: [string, 'null']
          description: Required for `envelope`. Not a secret.
        auth_token:
          type: [string, 'null']
          format: password
          writeOnly: true
          description: |
            Required for `envelope`. WRITE-ONLY — sealed on receipt and never
            returned by any endpoint. Omit to keep the stored value.
        messaging_service_sid:
          type: [string, 'null']
        from_number:
          type: [string, 'null']
        campaign_ref:
          type: [string, 'null']
          description: A2P/10DLC campaign registration reference.
        daily_spend_ceiling_cents:
          type: [integer, 'null']
          format: int32
          description: Per-day spend cap for this tenant. Omit to keep current.
    TenantSmsConfigResponse:
      type: object
      required:
      - tenant_id
      - environment
      - provider
      - custody_mode
      - status
      - credential_configured
      - daily_spend_ceiling_cents
      properties:
        tenant_id:
          type: string
        environment:
          type: string
        provider:
          type: string
        custody_mode:
          type: string
        status:
          type: string
          description: '`pending_validation` | `active` | `revoked`'
        credential_configured:
          type: boolean
          description: Whether a credential is stored — never the credential itself.
        account_sid:
          type: [string, 'null']
        connected_account_sid:
          type: [string, 'null']
        messaging_service_sid:
          type: [string, 'null']
        from_number:
          type: [string, 'null']
        campaign_ref:
          type: [string, 'null']
        daily_spend_ceiling_cents:
          type: integer
          format: int32
        last_validated_at:
          type: [string, 'null']
          format: date-time
    OidcAuthorizationCompleteResponse:
      type: object
      additionalProperties: false
      required:
      - redirect
      properties:
        redirect:
          type: string
          format: uri
          description: The registered redirect URI with `code` and `state` appended
    OidcAuthorizationStatusResponse:
      type: object
      additionalProperties: false
      required:
      - active
      - expires_in
      - initiate_login_uri
      properties:
        active:
          type: boolean
          description: The request can still be completed (not expired, not used)
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the request expires; 0 when it is not active
        initiate_login_uri:
          type: [string, 'null']
          description: The client's registered sign-in start (OIDC client metadata), or null when none is registered
    OidcAuthorizationCompleteRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      properties:
        request_id:
          type: string
          minLength: 43
          maxLength: 128
    OidcTokenRequest:
      type: object
      additionalProperties: false
      required:
      - grant_type
      properties:
        grant_type:
          type: string
          enum:
          - authorization_code
          - refresh_token
        client_id:
          type: string
          minLength: 1
          maxLength: 128
        client_secret:
          type: string
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
        refresh_token:
          type: string
        scope:
          type: string
    OidcTokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - scope
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          format: int64
        id_token:
          type: string
        refresh_token:
          type: string
        refresh_token_expires_in:
          type: integer
          format: int64
        scope:
          type: string
    OidcUserInfoResponse:
      type: object
      required:
      - sub
      properties:
        sub:
          type: string
        name:
          type:
          - string
          - 'null'
        given_name:
          type:
          - string
          - 'null'
        family_name:
          type:
          - string
          - 'null'
        preferred_username:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        email_verified:
          type:
          - boolean
          - 'null'
    OidcClientCreateRequest:
      type: object
      additionalProperties: false
      required:
      - application_id
      - client_type
      - redirect_uris
      - grants
      - response_types
      - scopes
      - audiences
      properties:
        application_id:
          type: string
          minLength: 1
          maxLength: 64
        client_type:
          type: string
          enum:
          - public
          - confidential
        token_endpoint_auth_method:
          type: string
          enum:
          - none
          - client_secret_basic
          - client_secret_post
        redirect_uris:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uri
        post_logout_redirect_uris:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
        initiate_login_uri:
          type: string
          format: uri
          maxLength: 2048
          description: 'OIDC client metadata `initiate_login_uri`: the client''s own sign-in start (https), where the
            hosted login page sends a browser whose authorization request expired'
        grants:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - authorization_code
            - refresh_token
        response_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - code
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9_.:-]{1,128}$'
        audiences:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 255
    OidcClientUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - active
          - disabled
        redirect_uris:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uri
        post_logout_redirect_uris:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
        initiate_login_uri:
          type: string
          maxLength: 2048
          description: 'OIDC client metadata `initiate_login_uri` (https). Omit to keep the registered value; an empty
            string removes it'
        grants:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - authorization_code
            - refresh_token
        response_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - code
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9_.:-]{1,128}$'
        audiences:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 255
    OidcClientResponse:
      type: object
      required:
      - client_id
      - tenant_id
      - application_id
      - client_type
      - token_endpoint_auth_method
      - pkce_s256_required
      - status
      - redirect_uris
      - post_logout_redirect_uris
      - grants
      - response_types
      - scopes
      - audiences
      - created_at
      - updated_at
      properties:
        client_id:
          type: string
        tenant_id:
          type: string
        application_id:
          type: string
        client_type:
          type: string
          enum:
          - public
          - confidential
        token_endpoint_auth_method:
          type: string
          enum:
          - none
          - client_secret_basic
          - client_secret_post
        pkce_s256_required:
          type: boolean
        status:
          type: string
          enum:
          - active
          - disabled
          - deleted
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        initiate_login_uri:
          type: [string, 'null']
        grants:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        audiences:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OidcClientListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OidcClientResponse'
    OidcClientCreateResponse:
      type: object
      required:
      - client
      - client_secret
      - secret_id
      properties:
        client:
          $ref: '#/components/schemas/OidcClientResponse'
        client_secret:
          type:
          - string
          - 'null'
          description: Confidential client secret shown exactly once; null for public clients.
        secret_id:
          type:
          - string
          - 'null'
          format: uuid
    OidcClientSecretRotateRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
          default: 300
    OidcClientSecretResponse:
      type: object
      required:
