              schema:
                $ref: '#/components/schemas/OidcAuthorizationStatusResponse'
        '400':
          description: "Bad request \u2014 validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The authorization request store is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-consumer: frontend
      x-consumer-note: Hosted login page (frontend/auth) checks its request_id before and during sign-in
      x-brrtrouter-impl: true
