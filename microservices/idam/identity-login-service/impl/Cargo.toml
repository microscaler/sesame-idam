
[package]
name = "sesame_idam_identity_login_service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sesame_idam_identity_login_service"
path = "src/main.rs"

[lib]
name = "sesame_idam_identity_login_service"
path = "src/lib.rs"

[features]
# jemalloc by default (23 Oct 2026): less fragmentation than glibc malloc with many threads, and heap profiles in pp.
default = ["jemalloc"]
# jemalloc is opt-in (--features jemalloc). On armv7-unknown-linux-musleabihf and other musl
# targets, tikv-jemallocator can pull in compiler-rt symbols (e.g. __ffsdi2) that are not
# provided by musl, causing link errors. Use default = [] and enable jemalloc only for
# amd64/arm64 glibc builds where it is supported. See: https://github.com/rust-lang/compiler-builtins
jemalloc = ["tikv-jemallocator"]

[dependencies]
sesame_common = { workspace = true }
# Lifeguard ORM
lifeguard = { workspace = true }
lifeguard-derive = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
arc-swap = { workspace = true }

# Database layer
sesame_idam_database = { path = "../../../database" }
# client_credentials grant validates M2M clients against the api-keys
# service's table via its model/service layer (PRD-OPENGROUPWARE F1).
sesame_idam_api_keys = { path = "../../api-keys/impl" }
sesame_idam_identity_session_service = { path = "../../identity-session-service/impl" }

sesame_idam_identity_login_service_gen = { path = "../gen" }

brrtrouter = { workspace = true }
brrtrouter_macros = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
# AES-256-GCM for envelope-encrypting tenant SMS credentials (ADR-009 Tier 2).
ring = { workspace = true }
serde_json = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }
clap = { workspace = true }
may = { workspace = true }

# Direct `may_postgres` is required for `lifeguard_derive` (`LifeModel` / `LifeRecord`) macros.
# Workspaces may `[patch]` this git URL to a local fork (e.g. Microscaler `may_postgres`).
may_postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4"] }

# Lifeguard derive macros need these
anyhow = { workspace = true }
config = { workspace = true }
http = { workspace = true }
lifeguard-migrate = { workspace = true }
may_minihttp = { workspace = true }
sea-query = { workspace = true }
serde_yaml = { workspace = true }
tracing = "0.1"

# Authentication flows (login/register)
argon2 = { workspace = true }
redis = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hex.workspace = true
url = "2.5.8"
# Passkeys (ADR-008): the WebAuthn relying party. State serialisation keeps a ceremony's state in Redis between the
# browser's two round trips (single use, 5 minutes); conditional-ui adds username-less sign-in.
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# webauthn-rs verifies signatures with OpenSSL. Vendored: built from source and linked statically, so neither the
# build image nor the run image needs OpenSSL's development files or shared library.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
lifeguard-migrate = { workspace = true }
[dev-dependencies]
# Test-only RSA key generation for RS256 ID token tests (ADR-015).
rsa = { version = "0.9", features = ["pem"] }
rstest = "0.21"
rstest-bdd = "0.6.0"
rstest-bdd-macros = "0.5.0"

base64 = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
redis = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sesame_idam_identity_session_service_gen = { path = "../../identity-session-service/gen" }

