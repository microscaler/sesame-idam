# saml-verifier: a Cargo workspace of its own (ADR-014 §4, amended 2026-10-11).
#
# The service has the standard Sesame shape (OpenAPI, BRRTRouter gen crate, impl crate, shared chart), but builds
# here and in its own image (docker/saml-verifier/Dockerfile) so libxmlsec1, libxml2 and OpenSSL never reach the
# suite workspace, the Rust buildpack or the suite's run image. The C dependency sits behind `core`: replacing it
# with a pure-Rust verifier later changes `core` and the Dockerfile, not the service.
[workspace]
members = ["core", "gen", "impl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Same pins as microservices/Cargo.toml for everything the suite also uses.
[workspace.dependencies]
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "556d6ee328f3482cb5e3feb48a9f3dab262474cf", default-features = false }
brrtrouter_macros = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "556d6ee328f3482cb5e3feb48a9f3dab262474cf" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.14"
http = "1.0"
may = "0.3"
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork", features = ["client"] }
http_legacy = { package = "http", version = "0.2" }
anyhow = "1.0"
arc-swap = "1.7"
clap = { version = "4.5", features = ["derive"] }
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
tracing = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sesame-saml-verifier = { path = "core" }

[patch.crates-io]
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork" }
