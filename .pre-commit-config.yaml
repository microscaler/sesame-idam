# Pre-commit: https://pre-commit.com
# Install: just init && just install-hooks
# Run manually: pre-commit run --all-files
# Same guard rails as RERP.

repos:
  - repo: local
    hooks:
      - id: sops-encrypted
        name: Secret files are SOPS-encrypted
        entry: scripts/check-sops-encrypted.sh
        language: system
        files: '[.]secrets?[.](env|ya?ml)$'
        pass_filenames: true
      - id: microservices-rustfmt
        name: cargo fmt --check (microservices, as the pipeline's lint)
        # The command the Octopilot lint fails on. Check only: run (cd microservices && cargo fmt --all) to fix.
        entry: bash -c 'cd microservices && cargo fmt --all -- --check'
        language: system
        files: '^microservices/.*[.]rs$'
        pass_filenames: false
      - id: qa
        name: Tooling QA (lint, format-check, tests)
        # Needs just and a sibling BRRTRouter checkout (just init): where they are absent (the pipeline's lint, a
        # fresh clone) it says so and passes; the pipeline runs fmt, clippy and the tests itself.
        entry: bash
        args: [-c, 'command -v just >/dev/null || { echo "just not installed, tooling QA skipped"; exit 0; }; just qa']
        language: system
        pass_filenames: false

      - id: check-empty-print-statements
        name: Check for empty print statements to stderr/stdout
        entry: bash
        args: [
          -c,
          'if grep -rn ''print("", file=sys\.\(stderr\|stdout\)'' tooling/src/ tooling/tests/ 2>/dev/null; then echo "Error: Empty print statements to stderr/stdout are forbidden. Provide descriptive error messages."; exit 1; fi'
        ]
        language: system
        pass_filenames: false
