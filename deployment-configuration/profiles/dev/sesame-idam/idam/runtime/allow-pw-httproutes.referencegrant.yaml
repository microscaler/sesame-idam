# Allow the PriceWhisperer platform portal's HTTPRoute (pw namespace) to
# target the identity-login-service Service here in sesame-idam. The portal
# authenticates staff same-origin at /idam/v1/auth/* per the Identity &
# Marketing-Data Architecture (D2 sesame is the sole issuer, D7 no BFF).
# US_31_03 (#134 in microscaler/PriceWhisperer).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-pw-httproutes
  namespace: sesame-idam
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: pw
  to:
    - group: ""
      kind: Service
      name: identity-login-service
