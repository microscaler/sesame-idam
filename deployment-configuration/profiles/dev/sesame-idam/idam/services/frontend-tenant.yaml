# Sesame frontend: sesame-tenant → https://app.sesameidentity.dev.local  (ADR-010, ADR-013)
#
# `app.` is the TENANT console. The platform console is a separate origin on
# `platform.` (ADR-013 amendment, 2026-07-25) so that a tenant admin's session
# cookie cannot reach it — enforced by the browser, not by our code.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sesame-tenant
spec:
  interval: 5m
  timeout: 5m
  releaseName: sesame-tenant
  targetNamespace: sesame-idam
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: ./helm/sesame-idam-frontend
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: product-sesame-idam
        namespace: flux-system
      interval: 1m
  values:
    service:
      name: sesame-tenant
    image:
      name: sesame-idam-frontend-tenant
      tag: tilt # {"$imagepolicy": "flux-system:sesame-idam-frontend-tenant:tag"}
    route:
      enabled: true
      # New host first (it becomes the ownership annotation); old host kept for
      # the transition — see frontend-platform.yaml.
      hostnames:
        - app.sesameidentity.dev.local
        - sesame-tenant.dev.microscaler.local
      gateway:
        sectionNameHttp:
          - sesameidentity-http
          - http
        sectionNameHttps:
          - sesameidentity-https
          - https

