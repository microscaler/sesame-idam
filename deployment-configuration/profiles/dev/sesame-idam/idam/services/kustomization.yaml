apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sesame-idam

resources:
  - identity-login-service.yaml
  - identity-session-service.yaml
  - identity-user-mgmt-service.yaml
  - authz-core.yaml
  - api-keys.yaml
  - org-mgmt.yaml
  # Frontends (ADR-010)
  - frontend-platform.yaml
  - frontend-tenant.yaml
  - frontend-brochure.yaml
  - frontend-auth.yaml
  # North–south front door for the backends above: api. and id. (task 50,
  # ADR-013). Routes only — it deploys no workload, it exposes the ones here.
  - api-edge.yaml

configMapGenerator:
  - name: sesame-idam-idam-common-helm-values
    files:
      - values.yaml=values/common.yaml

generatorOptions:
  disableNameSuffixHash: true
  immutable: false
