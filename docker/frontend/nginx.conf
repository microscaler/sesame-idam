# Sesame frontend static server (ADR-010).
#
# SPA fallback + a narrow /idam proxy so the browser talks to ONE origin per app:
# the hosted auth surface and the consoles call the identity services
# same-origin, which keeps the Gate A5 CORS allow-list small and makes the
# ADR-008 passkey story (one origin) hold at the edge too.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness/readiness — cheap, no SPA fallback.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Deployment settings (chart runtimeConfig → ConfigMap mounted at /etc/sesame-frontend). Absent: 404, and the app
  # says what is not configured.
  location = /config.json {
    alias /etc/sesame-frontend/config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Identity API, same-origin, for exactly what the browser apps call. Everything else under /idam/ (the operator
  # /platform API, admin and service-to-service routes) is not reachable through a frontend: 404 here, and the
  # api-edge routes only the public surface.
  #   auth app:        sign-in, OTP, magic link, password reset, session handoff (POST)
  #   client SDK:      code exchange and refresh (POST /auth/token)
  #   tenant console:  the tenant's own SMS sender, tenant taken from the bearer token (GET/PUT/DELETE)
  location ~ ^/idam/v1/auth/(login|login/email-otp|login/phone-otp|verify/email-otp|verify/phone-otp|magic-link|verify-magic|password/forgot|password/reset|session/code|token)$ {
    limit_except POST { deny all; }
    proxy_pass http://identity-login-service.sesame-idam.svc.cluster.local:8080;
    include /etc/nginx/conf.d/idam-proxy.inc;
  }

  location ~ ^/idam/v1/tenant/sms/[A-Za-z0-9_-]+$ {
    limit_except GET PUT DELETE { deny all; }
    proxy_pass http://identity-login-service.sesame-idam.svc.cluster.local:8080;
    include /etc/nginx/conf.d/idam-proxy.inc;
  }

  location /idam/ {
    return 404;
  }

  # Hashed assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routes (/authorize, /verify-magic, console deep links).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    # Hardening: the auth surface must not be framed by third parties
    # (clickjacking on the credential ceremony). Consoles inherit the same.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
