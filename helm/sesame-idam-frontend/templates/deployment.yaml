apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.deployment.namespace }}
  labels:
    app: {{ .Values.service.name }}
    app.kubernetes.io/part-of: sesame-idam
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
        app.kubernetes.io/part-of: sesame-idam
      {{- if .Values.runtimeConfig }}
      annotations:
        checksum/runtime-config: {{ .Values.runtimeConfig | toJson | sha256sum | trunc 8 | quote }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
          {{- if .Values.runtimeConfig }}
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/sesame-frontend
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: {{ .Values.service.name }}-runtime-config
          {{- end }}
