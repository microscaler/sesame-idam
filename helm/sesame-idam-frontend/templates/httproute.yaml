{{- if and .Values.route.enabled .Values.route.hostnames }}
# Shared edge Gateway (Envoy Gateway). haproxy owns *.dev.microscaler.local and
# sesameidentity.dev.local on the LAN and forwards to this Gateway. Which of the
# Gateway's listeners this route binds to comes from `route.gateway.sectionName*`
# — it has to match the zone the hostnames are in, see values.yaml.
#
# Rule order matters: for matches of equal specificity Gateway API takes the
# first, so the plaintext redirect has to precede the catch-all that serves
# the app — otherwise everything is served and nothing ever redirects.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.deployment.namespace }}
  labels:
    app: {{ .Values.service.name }}
    app.kubernetes.io/part-of: sesame-idam
  annotations:
    gitops.microscaler.io/gateway: {{ .Values.route.gateway.name }}
    gitops.microscaler.io/hostname: {{ index .Values.route.hostnames 0 | quote }}
spec:
  hostnames:
{{ toYaml .Values.route.hostnames | indent 4 }}
  parentRefs:
{{- include "sesame.gatewayParentRefs" . | nindent 4 }}
  rules:
{{- include "sesame.httpsRedirectRule" (dict "ctx" . "paths" (list "/")) | nindent 4 }}
    - matches:
        - path:
            type: PathPrefix
            value: /
{{- include "sesame.hstsFilter" . | nindent 6 }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
{{- end }}
