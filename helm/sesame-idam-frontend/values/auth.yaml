# Hosted AUTH surface (ADR-010 §2.2) — its OWN origin, deliberately.
#
# The credential ceremony (password, OTP, magic link, and later passkeys) must
# live on ONE trusted origin: WebAuthn is origin-bound, so serving these pages
# from a console host would break the ADR-008 phishing-resistance story. In
# production this host is replaced per tenant by their ADR-007 verified domain
# (e.g. login.tenant.com) serving this same bundle, themed at runtime.
service:
  name: sesame-auth
image:
  name: sesame-idam-frontend-auth
deployment:
  replicas: 1
  namespace: sesame-idam
route:
  enabled: true
  # `auth.` is the login surface and holds the IdP session cookie. It is NOT
  # `id.`: the issuer host (OIDC discovery + JWKS) must stay cookie-free so it
  # carries no ambient authority and can be cached anywhere — ADR-013. `id.` and
  # `api.` are now served by helm/sesame-idam-api-edge (tasks 50 + 57), which
  # strips Cookie and Set-Cookie on both; this host deliberately does neither.
  #
  # New host first (it becomes the ownership annotation); old host retained
  # for the transition — see values/platform.yaml.
  hostnames:
    - auth.sesameidentity.dev.local
    - sesame-auth.dev.microscaler.local
  gateway:
    sectionNameHttp:
      - sesameidentity-http
      - http
    sectionNameHttps:
      - sesameidentity-https
      - https
