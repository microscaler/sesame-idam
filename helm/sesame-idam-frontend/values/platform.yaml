# Sesame PLATFORM console (operator view).
#
# `platform.` and NOT `app.` — ADR-013's 2026-07-25 amendment. The tenant
# console is a separate origin so the BROWSER keeps operator and tenant
# sessions apart (ADR-011 §1); shared-origin separation would only ever be
# application code remembering which session it holds.
service:
  name: sesame-portal
image:
  name: sesame-idam-frontend-platform
deployment:
  replicas: 1
  namespace: sesame-idam
route:
  enabled: true
  # Canonical host first: httproute.yaml publishes hostnames[0] as the
  # `gitops.microscaler.io/hostname` ownership annotation. The old host stays
  # until bookmarks and dev configs have moved — both are served, so the cut
  # is reversible and nobody is locked out mid-transition.
  hostnames:
    - platform.sesameidentity.dev.local
    - sesame-portal.dev.microscaler.local
  gateway:
    # One listener per zone, so both hostnames above actually attach.
    sectionNameHttp:
      - sesameidentity-http
      - http
    sectionNameHttps:
      - sesameidentity-https
      - https
