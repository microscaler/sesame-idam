# Default values for sesame-idam-microservice (same pattern as RERP)
# Override in values/authentication.yaml and values/authorization.yaml
# Database: Supabase stack from microscaler-supabase (namespace data). Host: postgres.data.svc.cluster.local, db: postgres, user: postgres (local dev).

service:
  # Placeholder so a bare render (helm template, the pipeline's chart check) is valid. Every release sets it.
  name: sesame-idam-microservice
  port: 8080
  containerPort: 8080
  nodePort: null

image:
  repository: localhost:5001
  name: sesame-idam-microservice         # placeholder, as service.name
  tag: tilt
  pullPolicy: IfNotPresent

deployment:
  replicas: 1
  namespace: sesame-idam

app:
  binaryName: ""
  serviceName: ""
  config:
    # No API keys by default: each environment sets its own (dev: values/<service>.yaml).
    http:
      keep_alive: true
      timeout_secs: 5
      max_requests: 50000
    database:
      # The deployment's database host. Empty: the service refuses to start (development sets it in
      # values/_database-kubernetes.yaml or the dev profile).
      host: ""
      port: 5432
      name: "sesame_idam"
      user: "sesame_idam"
      # Dev only (values/_database-kubernetes.yaml). Elsewhere: database.secretName.
      password: ""
      max_connections: 2
    redis:
      # Development: the shared platform Redis (values/_database-kubernetes.yaml). Deployments use redis.urlSecret.
      host: ""
      port: 6379
      db: 0
      max_connections: 4
    observability:
      otlp_endpoint: ""
    # SMS (ADR-009). Empty: disabled (no SMS is sent). `twilio` once the platform credentials Secret is populated;
    # `mock` (records to a Redis outbox) is for development only.
    sms:
      provider: ""
      allowedPurposes: "registration,password_reset,tenant_registration,environment_registration,tenant_owner_recovery,platform_operator"
      platformDailyCeilingCents: 1000
      # Comma-separated tenant slugs allowed to store credentials with Sesame
      # instead of authorising via Twilio Connect (ADR-009 §2.3). Deliberately
      # empty by default: every external tenant should use Connect, where
      # Twilio bills them directly and we hold nothing worth stealing.
      envelopeCustodyTenants: ""

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

healthCheck:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

env:
  RUST_LOG: "info"
  RUST_BACKTRACE: "1"
  BRRTR_LOG_FORMAT: "json"
  BRRTR_STACK_SIZE: "0x8000"
  # The deployment's issuer and public URLs (https, its own domain). No defaults: outside devMode the chart and the
  # services refuse to start without them (sesame_common::deployment). Development sets them in values/_dev.yaml.
  SESAME_JWT_ISSUER: ""
  SESAME_AUTH_PUBLIC_URL: ""
  SESAME_API_PUBLIC_URL: ""
  # Transactional mail (OTP, magic links, org invites). Empty: no mail is sent (development: values/_dev.yaml).
  SMTP_HOST: ""
  SMTP_PORT: ""
  MAIL_FROM: ""
  # From display name (empty: "Sesame"); the product's name for its sign-in mail.
  MAIL_FROM_NAME: ""
  # Product onboarding page invite links point at. Empty: invites are stored but not emailed.
  INVITE_MAGIC_LINK_BASE: ""
  # Optional overrides; default <SESAME_AUTH_PUBLIC_URL>/verify-magic and /reset-password.
  MAGIC_LINK_BASE_URL: ""
  PASSWORD_RESET_BASE_URL: ""

serviceType: ClusterIP

# Development only (Tilt, the dev profile): sets SESAME_DEV_MODE=1, which lets the services fall back to development
# URLs and an ephemeral signing key, and lets the chart render without a signing keyset or ID-token keys. Never set it
# in a shared environment.
devMode: false

# ADR-006 shared signing keyset (Ed25519 access and refresh tokens), a Secret delivered from SOPS. Required outside
# devMode for the services that sign or publish keys (identity-login-service, identity-session-service).
signingKeyset:
  enabled: false
  secretName: sesame-idam-signing-keyset

# ADR-015 ID-token keys (RS256): a ConfigMap holding the key configuration file read through SESAME_ID_TOKEN_KEYS,
# normally {"backend": "gcp-kms", "key_versions": [...]} (names of HSM key versions, not key material). Required
# outside devMode for identity-login-service and identity-session-service.
idTokenKeys:
  configMap: ""
  key: id-token-keys.json

# Agent registry (sesame_common::agents): non-human principals that sign in with a key. A ConfigMap delivered by
# GitOps; only identity-session-service (which issues agent tokens) needs it. Empty: no agents.
agents:
  configMap: ""
  key: agents.yaml

prometheus:
  enabled: true
  port: 9090
  path: "/metrics"

# Google Cloud Managed Service for Prometheus (templates/podmonitoring.yaml): scrape prometheus.path on the http port.
# On in GKE environments (Application Monitoring golden signals); off where the PodMonitoring CRD is absent.
podMonitoring:
  enabled: false
  interval: 30s

# ---------------------------------------------------------------------------
# Release shape (Octopilot). Defaults keep the dev (Tilt) behaviour.
# ---------------------------------------------------------------------------
workload:
  kind: service            # service | job (one-shot, Helm pre-install/pre-upgrade hook: the schema migration)
  # The services read ./config/config.yaml, mounted at /app/config. Dev images set WORKDIR /app; release images
  # (buildpacks) start in /workspace, so the chart sets it.
  workingDir: /app
  extraEnv: []             # plain env list, appended last (e.g. DB_SSLMODE)
  # Container args. Dev images pass the spec, docs, static site and config paths in their entrypoint. Release images
  # (/cnb/process/<binary>) need them here, e.g. for <service>:
  #   --spec /workspace/microservices/idam/<service>/gen/doc/openapi.yaml --doc-dir .../gen/doc
  #   --static-dir .../gen/static_site --config /app/config/config.yaml
  args: []
  envFrom: []              # extra envFrom sources
  strategy: ""             # "" = RollingUpdate (surge-first, see rollout); Recreate for single-instance workloads

# Extra labels on the workload and its pods (e.g. the label an environment's credential rotation restarts by).
podLabels: {}

# The workload's Kubernetes service account. create: one named after the service, with these annotations (for GKE
# Workload Identity: iam.gke.io/gcp-service-account, e.g. the identity allowed to sign with a Cloud KMS key). Off: the
# namespace's default service account.
serviceAccount:
  create: false
  annotations: {}
podSecurityContext: {}
securityContext: {}

database:
  # Secret holding the service's own login (DB_USER, DB_PASS, DB_NAME). Set: the chart's DB_NAME / DB_USER /
  # password values are not used. Empty: dev (sesame-idam-db-credentials, then the dev password).
  secretName: ""

# Platform operator key (identity-login-service, PlatformServiceAuth on /platform/*). Empty: no key, so every
# platform request is rejected. The key is at least 32 characters and never in values or git.
platformAdminKey:
  secretName: ""
  key: key

redis:
  # Secret key holding the full REDIS_URL (with password and database). Empty: redis://<host>:<port> from
  # app.config.redis.
  urlSecret:
    name: ""
    key: REDIS_URL

helmTest:
  enabled: true
  image: curlimages/curl:8.10.1

# workload.kind job only.
job:
  backoffLimit: 0
  activeDeadlineSeconds: 900

# Availability. A single replica (pp) still rolls surge-first with a preStop
# drain; the PodDisruptionBudget and topology spread render only when
# deployment.replicas > 1 (production).
rollout:
  maxSurge: 1
  maxUnavailable: 0
  preStopSleepSeconds: 5          # 0 disables the preStop hook
  terminationGracePeriodSeconds: 30
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  topologyKeys:
    - topology.kubernetes.io/zone
    - kubernetes.io/hostname
