{{- if eq .Values.workload.kind "service" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.deployment.namespace }}
  labels:
    app: {{ .Values.service.name }}
    {{- with .Values.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* Gate B1 / ADR-006: with in-memory (ephemeral) signing keys, multiple
       replicas would serve disagreeing keysets. Scaling is allowed ONLY when
       the shared signing keyset is mounted (signingKeyset.enabled — ADR-006
       step 1): every replica then loads the same keys with the same kids. */}}
  {{- if and (eq .Values.service.name "identity-session-service") (gt (int .Values.deployment.replicas) 1) (not (and .Values.signingKeyset .Values.signingKeyset.enabled)) }}
  {{- fail "identity-session-service with replicas > 1 requires signingKeyset.enabled=true (ADR-006 shared keyset). With in-memory keys, multi-replica serves disagreeing JWKS." }}
  {{- end }}
  {{- /* Outside development nothing falls back: the deployment names its issuer and URLs and mounts its keys. */}}
  {{- $issuing := has .Values.service.name (list "identity-login-service" "identity-session-service") }}
  {{- /* The placeholder name is a bare render (the pipeline's chart check), not a release. */}}
  {{- if and (not .Values.devMode) (ne .Values.service.name "sesame-idam-microservice") }}
  {{- $_ := required "env.SESAME_JWT_ISSUER is required (https, the deployment's own issuer); devMode only in development" .Values.env.SESAME_JWT_ISSUER }}
  {{- if $issuing }}
  {{- $_ := required "env.SESAME_AUTH_PUBLIC_URL is required" .Values.env.SESAME_AUTH_PUBLIC_URL }}
  {{- $_ := required "env.SESAME_API_PUBLIC_URL is required" .Values.env.SESAME_API_PUBLIC_URL }}
  {{- if not (and .Values.signingKeyset .Values.signingKeyset.enabled) }}
  {{- fail (printf "%s signs or publishes tokens: signingKeyset.enabled=true is required outside devMode (ADR-006)" .Values.service.name) }}
  {{- end }}
  {{- $_ := required "idTokenKeys.configMap is required outside devMode (ADR-015, RS256 ID tokens)" .Values.idTokenKeys.configMap }}
  {{- end }}
  {{- $_ := required "app.config.database.host is required outside devMode" .Values.app.config.database.host }}
  {{- $_ := required "database.secretName is required outside devMode (the service's own login)" .Values.database.secretName }}
  {{- if not (or .Values.redis.urlSecret.name .Values.app.config.redis.host) }}
  {{- fail "redis.urlSecret.name is required outside devMode" }}
  {{- end }}
  {{- if eq (.Values.app.config.sms.provider | default "") "mock" }}
  {{- fail "app.config.sms.provider=mock is development only" }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    {{- if eq (.Values.workload.strategy | default "RollingUpdate") "Recreate" }}
    # Recreate for single-instance pollers - two concurrent cursors on the
    # same feed would double-ingest.
    type: Recreate
    {{- else }}
    # Surge first: the new pod must be Ready before an old one is removed, so a
    # rollout never drops below the running replica count (with 1 replica:
    # bring the new pod up, then retire the old one).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: "{{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum | trunc 8 }}"
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.service.name }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # preStop sleep + SIGTERM drain must fit inside this.
      terminationGracePeriodSeconds: {{ .Values.rollout.terminationGracePeriodSeconds }}
      {{- if and (gt (int .Values.deployment.replicas) 1) .Values.topologySpread.enabled }}
      # Spread replicas across zones and nodes so one node or zone loss never
      # takes every pod. ScheduleAnyway: prefer, never block scheduling.
      topologySpreadConstraints:
        {{- range .Values.topologySpread.topologyKeys }}
        - maxSkew: {{ $.Values.topologySpread.maxSkew }}
          topologyKey: {{ . }}
          whenUnsatisfiable: {{ $.Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ $.Values.service.name }}
          matchLabelKeys:
            - pod-template-hash
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.workload.workingDir }}
          # The services read ./config/config.yaml (mounted at /app/config). Dev images set WORKDIR /app; release
          # images (buildpacks) start elsewhere.
          workingDir: {{ . | quote }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.containerPort | quote }}
            - name: RUST_LOG
              value: {{ .Values.env.RUST_LOG | quote }}
            - name: RUST_BACKTRACE
              value: {{ .Values.env.RUST_BACKTRACE | quote }}
            - name: BRRTR_LOG_FORMAT
              value: {{ .Values.env.BRRTR_LOG_FORMAT | quote }}
            - name: BRRTR_STACK_SIZE
              value: {{ .Values.env.BRRTR_STACK_SIZE | quote }}
            - name: SESAME_JWT_ISSUER
              value: {{ .Values.env.SESAME_JWT_ISSUER | quote }}
            - name: SESAME_AUTH_PUBLIC_URL
              value: {{ .Values.env.SESAME_AUTH_PUBLIC_URL | quote }}
            - name: SESAME_API_PUBLIC_URL
              value: {{ .Values.env.SESAME_API_PUBLIC_URL | quote }}
            # ── Lifeguard database pool (sesame_idam_database reads DB_*) ──
            - name: DB_HOST
              value: {{ .Values.app.config.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.app.config.database.port | quote }}
            - name: DB_POOL_MAX
              value: {{ .Values.app.config.database.max_connections | quote }}
            {{- if not .Values.database.secretName }}
            - name: DB_NAME
              value: {{ .Values.app.config.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.app.config.database.user | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-db-credentials
                  key: password
                  optional: true
            {{- if .Values.devMode }}
            # Development fallback when the Secret is absent (local clusters only).
            - name: SESAME_IDAM_DB_PASSWORD
              value: {{ .Values.app.config.database.password | quote }}
            {{- end }}
            {{- end }}
            # ── Redis (refresh tokens, denylist, version store) ──
            {{- if .Values.redis.urlSecret.name }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.urlSecret.name | quote }}
                  key: {{ .Values.redis.urlSecret.key | quote }}
            {{- else }}
            - name: REDIS_URL
              value: "redis://{{ .Values.app.config.redis.host }}:{{ .Values.app.config.redis.port }}"
            {{- end }}
            {{- if .Values.app.config.authzCoreUrl }}
            # ── authz-core enrichment (identity-login-service) ──
            - name: AUTHZ_CORE_URL
              value: {{ .Values.app.config.authzCoreUrl | quote }}
            {{- end }}
            {{- if .Values.devMode }}
            - name: SESAME_DEV_MODE
              value: "1"
            # ── Legacy single signing key pair (development only; deployments use the keyset below). Optional:
            #    without it, development falls back to an ephemeral key.
            - name: SESAME_JWT_SIGNING_KEY_PKCS8_B64
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-jwt-signing
                  key: pkcs8_b64
                  optional: true
            - name: SESAME_JWT_SIGNING_KID
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-jwt-signing
                  key: kid
                  optional: true
            {{- end }}
            {{- if .Values.idTokenKeys.configMap }}
            # ── ADR-015 ID-token keys (RS256): configuration naming the HSM key versions.
            - name: SESAME_ID_TOKEN_KEYS
              value: "/etc/sesame/id-token/{{ .Values.idTokenKeys.key }}"
            {{- end }}
            {{- if and .Values.agents .Values.agents.configMap }}
            # ── Agent registry (key-authenticated, non-human principals).
            - name: SESAME_AGENTS_FILE
              value: "/etc/sesame/agents/{{ .Values.agents.key }}"
            {{- end }}
            {{- if and .Values.signingKeyset .Values.signingKeyset.enabled }}
            # ── ADR-006 step 1: shared signing KEYSET (SOPS-delivered Secret).
            #    All replicas load the same keys with deterministic RFC 7638
            #    kids; rotation = edit the keyset; session-service reloads the
            #    mount live. Takes precedence over the env key pair above.
            - name: KEY_SOURCE
              value: "file"
            - name: SESAME_SIGNING_KEYSET_FILE
              value: "/etc/sesame/keys/signing-keyset.json"
            {{- end }}
            {{- if .Values.platformAdminKey.secretName }}
            # ── Platform operator key (PlatformServiceAuth): from a Secret only, never a default.
            - name: SESAME_PLATFORM_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformAdminKey.secretName | quote }}
                  key: {{ .Values.platformAdminKey.key | quote }}
            {{- end }}
            # ── PLATFORM Twilio (ADR-009 Tier 0) ──
            # Platform-billed purposes ONLY (tenant onboarding, environment
            # registration, tenant-owner recovery, operator MFA). Tenant
            # end-user SMS resolves to the tenant's own account — never these.
            # Unset provider: disabled, nothing is sent or spent (mock only in development).
            - name: SMS_PROVIDER
              value: {{ .Values.app.config.sms.provider | default "disabled" | quote }}
            - name: SMS_ALLOWED_PURPOSES
              value: {{ .Values.app.config.sms.allowedPurposes | default "registration,password_reset,tenant_registration,environment_registration,tenant_owner_recovery,platform_operator" | quote }}
            - name: SMS_PLATFORM_DAILY_CEILING_CENTS
              value: {{ .Values.app.config.sms.platformDailyCeilingCents | default 1000 | quote }}
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-twilio
                  key: TWILIO_ACCOUNT_SID
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-twilio
                  key: TWILIO_AUTH_TOKEN
                  optional: true
            - name: TWILIO_MESSAGING_SERVICE_SID
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-twilio
                  key: TWILIO_MESSAGING_SERVICE_SID
                  optional: true
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-twilio
                  key: TWILIO_FROM_NUMBER
                  optional: true
            # ── TENANT credential custody (ADR-009 Tier 2) ──
            # Wraps the per-credential data keys that protect tenant Twilio
            # tokens at rest. Absent → envelope custody is unavailable and
            # tenants must use Twilio Connect, which is the preferred path
            # anyway; nothing silently falls back to the platform account.
            - name: SMS_CREDENTIAL_KEK
              valueFrom:
                secretKeyRef:
                  name: sesame-idam-twilio
                  key: SMS_CREDENTIAL_KEK
                  optional: true
            # Tenants permitted to hand Sesame a raw credential rather than
            # authorising via Connect. Empty (the default) means nobody —
            # this is a dogfood escape hatch, not a product feature.
            - name: SMS_ENVELOPE_CUSTODY_TENANTS
              value: {{ .Values.app.config.sms.envelopeCustodyTenants | default "" | quote }}
            # ── Mail and link settings: passed only when set (empty: no mail, derived links). ──
            {{- range $name := list "SMTP_HOST" "SMTP_PORT" "MAIL_FROM" "MAIL_FROM_NAME" "MAIL_ALLOW_RESERVED_DOMAINS" "INVITE_MAGIC_LINK_BASE" "MAGIC_LINK_BASE_URL" "PASSWORD_RESET_BASE_URL" }}
            {{- with (get $.Values.env $name) }}
            - name: {{ $name }}
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.app.config.observability.otlp_endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.app.config.observability.otlp_endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.app.serviceName | quote }}
            {{- end }}
            {{- with .Values.workload.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.database.secretName .Values.workload.envFrom }}
          envFrom:
            {{- if .Values.database.secretName }}
            # The service's own database login: DB_USER, DB_PASS, DB_NAME (and PG*, DATABASE_URL*).
            - secretRef:
                name: {{ .Values.database.secretName | quote }}
            {{- end }}
            {{- with .Values.workload.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readiness.failureThreshold }}
          {{- if gt (int .Values.rollout.preStopSleepSeconds) 0 }}
          # Endpoint removal reaches kube-proxy and the load balancer
          # asynchronously: keep serving for a few seconds after termination
          # starts so in-flight and late-routed requests are not refused.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.rollout.preStopSleepSeconds }}
          {{- end }}
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if and .Values.signingKeyset .Values.signingKeyset.enabled }}
            - name: signing-keyset
              mountPath: /etc/sesame/keys
              readOnly: true
            {{- end }}
            {{- if .Values.idTokenKeys.configMap }}
            - name: id-token-keys
              mountPath: /etc/sesame/id-token
              readOnly: true
            {{- end }}
            {{- if and .Values.agents .Values.agents.configMap }}
            - name: agents
              mountPath: /etc/sesame/agents
              readOnly: true
            {{- end }}
            - name: logs
              mountPath: /app/logs
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Values.service.name }}-config
        {{- if and .Values.signingKeyset .Values.signingKeyset.enabled }}
        - name: signing-keyset
          secret:
            secretName: {{ (default "sesame-idam-signing-keyset" .Values.signingKeyset.secretName) }}
        {{- end }}
        {{- if .Values.idTokenKeys.configMap }}
        - name: id-token-keys
          configMap:
            name: {{ .Values.idTokenKeys.configMap | quote }}
            items:
              - key: {{ .Values.idTokenKeys.key | quote }}
                path: {{ .Values.idTokenKeys.key | quote }}
        {{- end }}
        {{- if and .Values.agents .Values.agents.configMap }}
        # No subPath: a ConfigMap update reaches the running pod, and the registry is re-read on change.
        - name: agents
          configMap:
            name: {{ .Values.agents.configMap | quote }}
            items:
              - key: {{ .Values.agents.key | quote }}
                path: {{ .Values.agents.key | quote }}
        {{- end }}
        - name: logs
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
{{- end }}
