{{- /*
  workload.kind job: a one-shot Job run as a Helm pre-install/pre-upgrade hook, so every install and upgrade of the
  release runs it to completion first and a failure fails the release (nothing after it rolls out). Used for the
  schema migration (image sesame-idam-migrations, its own database login through database.secretName). The previous
  run is deleted when the next one is created; a successful run is deleted afterwards.
*/}}
{{- if eq .Values.workload.kind "job" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.deployment.namespace }}
  labels:
    app: {{ .Values.service.name }}
    {{- with .Values.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: {{ .Values.service.name }}
    spec:
      restartPolicy: Never
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.service.name }}
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SESAME_RELEASE
              value: {{ .Values.image.tag | quote }}
            {{- with .Values.workload.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.database.secretName .Values.workload.envFrom }}
          envFrom:
            {{- if .Values.database.secretName }}
            - secretRef:
                name: {{ .Values.database.secretName | quote }}
            {{- end }}
            {{- with .Values.workload.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
