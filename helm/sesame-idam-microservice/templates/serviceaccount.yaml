{{- if .Values.serviceAccount.create }}
# The workload's own identity (values serviceAccount): for GKE Workload Identity, annotated with the Google service
# account it acts as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.deployment.namespace }}
  labels:
    app: {{ .Values.service.name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
