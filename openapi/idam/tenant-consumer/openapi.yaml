openapi: 3.1.0
info:
  title: Sesame IDAM — Tenant Consumer API
  version: 1.0.0
  description: |
    **Sole public SDK OpenAPI** for tenant-facing Sesame IDAM operations.

    Called from product BFFs and (via BFF) end-user clients. Cross-cloud safe:
    no shared database with product services.

    - Tenant isolation is derived from a registered client or validated bearer token.
    - Callers must not send `X-Tenant-ID` to select or override tenancy.
    - Sesame owns users, orgs, memberships, invites, and invite email delivery.
    - Product databases store domain profiles keyed by `organization_id` from the
      verified principal (JWT `org_id`, nullable before org creation).

    Transport semantics: `docs/standards-first-oidc/transport-policy-v1.md`.
    Platform admin / SCIM / SAML remain in internal service OpenAPI and are out of scope.
  contact:
    name: Platform / Security
  x-provider-profile: "1.0.0"
  x-fixture-version: "1.1.0"

servers:
  - url: https://api.sesameidentity.dev.local/idam/v1
    description: Public tenant API v1 (override the host per environment)

tags:
  - name: Account
    description: Registration and session
  - name: Me
    description: Authenticated user's memberships and active org
  - name: Organizations
    description: Self-service org creation within a tenant
  - name: Invitations
    description: Invite lifecycle — Sesame sends email; user accepts via magic link

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Account]
      operationId: register_user
      summary: Create user account (no organization)
      x-public-reason: "public signup: reachable before an account exists"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered; token may omit organization_id
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /users/me/memberships:
    get:
      tags: [Me]
      operationId: list_my_memberships
      summary: List organizations the current user belongs to (or pending invites)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Membership page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /organizations:
    post:
      tags: [Organizations]
      operationId: create_organization
      summary: Create a new organization; caller becomes owner
      description: |
        Creates an org scoped to the bearer token's tenant. Caller must not
        already have an active org if tenant policy is single-org-per-user.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: User already has an organization (tenant policy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'

  /organizations/{org_id}/invitations:
    post:
      tags: [Invitations]
      operationId: invite_user_to_organization
      summary: Invite user by email — Sesame sends the magic-link email
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteByEmailRequest'
      responses:
        '200':
          description: Invitation queued/sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationQueued'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invitations/accept:
    post:
      tags: [Invitations]
      operationId: accept_invitation
      summary: Accept invite token (authenticated user; email must match invite)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Membership active; client should refresh token for org_id claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invitations/preview:
    get:
      tags: [Invitations]
      operationId: preview_invitation
      summary: Preview invite (org name) from token — optional UX before login
      x-public-reason: "the invitation token in the request IS the credential"
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invite still valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/active-organization:
    post:
      tags: [Me]
      operationId: set_active_organization
      summary: Set active org and return tokens including org_id claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: New tokens with org_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128

  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
    X-RateLimit-Remaining:
      schema:
        type: integer
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix seconds when the window resets
    Retry-After:
      schema:
        type: integer
      description: Seconds to wait before retrying

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'

  schemas:
    RegisterRequest:
      type: object
      required: [client_id, email, password, first_name, last_name]
      properties:
        client_id:
          type: string
          description: Registered public client; determines tenant and application.
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string

    TokenResponse:
      type: object
      required: [access_token, expires_in, token_type, user_id]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          const: Bearer
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          nullable: true
          description: Present when user has an active org context; null/omitted pre-org

    ErrorObject:
      type: object
      required: [error]
      properties:
        error:
          type: string
        error_description:
          type: string
        request_id:
          type: string

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display / legal name
        metadata:
          type: object
          additionalProperties: true
          description: Tenant-specific conventions (product-defined keys)

    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true

    MembershipSummary:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [pending, active]

    MembershipPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
        next_cursor:
          type: string
          nullable: true

    InviteByEmailRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          description: Tenant-defined role slug

    InvitationQueued:
      type: object
      properties:
        invitation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, sent]

    AcceptInvitationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          format: uuid

    InvitationPreview:
      type: object
      properties:
        organization_name:
          type: string
        inviter_email:
          type: string
        expires_at:
          type: string
          format: date-time
